<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Study | Kevin Trayner, Principal Experience Designer</title>
    <meta name="description" content="Case study detail from Kevin Trayner's design portfolio: principal experience design leadership focused on strategy, systems, and measurable outcomes." />
    <meta property="og:title" content="Case Study | Kevin Trayner, Principal Experience Designer" />
    <meta property="og:description" content="Strategic design and product leadership portfolio for hiring managers and design leaders." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="index.html#top" id="brand-name">Portfolio</a>
      <nav class="main-nav" aria-label="Main navigation" id="main-nav"></nav>
      <a class="btn btn-ghost" href="#" id="resume-link" target="_blank" rel="noreferrer">Resume</a>
    </header>

    <main id="top">
      <section class="case-hero reveal" id="case-hero"></section>
      <section class="section reveal" id="case-context"></section>
      <section class="section reveal" id="case-gallery"></section>
      <section class="section reveal" id="case-approach"></section>
      <section class="section reveal" id="case-decisions"></section>
      <section class="section reveal" id="case-outcomes"></section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close image">&times;</button>
      <div class="lightbox-nav" aria-label="Artifact navigation">
        <button type="button" class="lightbox-arrow" id="lightbox-prev" aria-label="Previous artifact">&larr;</button>
        <button type="button" class="lightbox-arrow" id="lightbox-next" aria-label="Next artifact">&rarr;</button>
      </div>
      <figure class="lightbox-figure">
        <img id="lightbox-img" src="" alt="" />
        <figcaption id="lightbox-caption-wrap">
          <span id="lightbox-counter"></span>
          <span id="lightbox-caption"></span>
        </figcaption>
      </figure>
    </div>

    <section id="contact" class="contact reveal">
      <p class="section-kicker" id="contact-kicker"></p>
      <h2 id="contact-heading"></h2>
      <div class="contact-links" id="contact-links"></div>
    </section>

    <footer class="site-footer">
      <p id="footer-left"></p>
      <p id="footer-right"></p>
    </footer>

    <script src="content.js"></script>
    <script src="common.js"></script>
    <script src="case-study.js"></script>
    <script src="edit-mode.js"></script>
  </body>
</html>
