<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MyPlan summary image</title>
  <desc id="desc">Abstract banner representing plan selection and customer flexibility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8f3ef"/>
      <stop offset="100%" stop-color="#dfe7f5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f4f8f7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1290" cy="180" r="220" fill="#c9dfe8" opacity="0.55"/>
  <rect x="130" y="180" width="1340" height="540" rx="30" fill="url(#card)" stroke="#d5dfe5"/>
  <rect x="230" y="280" width="350" height="260" rx="18" fill="#edf5f1" stroke="#dbe7e2"/>
  <rect x="620" y="280" width="230" height="18" rx="9" fill="#8ab4a6"/>
  <rect x="620" y="320" width="280" height="18" rx="9" fill="#b9cfe1"/>
  <rect x="620" y="360" width="250" height="18" rx="9" fill="#cdd8db"/>
  <rect x="620" y="420" width="190" height="76" rx="14" fill="#dfe8ee"/>
  <rect x="840" y="420" width="190" height="76" rx="14" fill="#dfe8ee"/>
  <rect x="1060" y="420" width="190" height="76" rx="14" fill="#dfe8ee"/>
  <rect x="1280" y="420" width="120" height="76" rx="14" fill="#cfe4d9"/>
  <text x="230" y="110" fill="#1d2b2d" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">myPlan</text>
  <text x="230" y="170" fill="#3d4c52" font-family="Arial, Helvetica, sans-serif" font-size="28">Clearer choices • More flexibility • Better value</text>
</svg>
