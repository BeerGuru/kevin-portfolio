<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Trayner | Principal Experience Designer</title>
    <meta name="description" content="Portfolio of Kevin Trayner: principal experience design leadership focused on strategy, systems, and measurable outcomes." />
    <meta property="og:title" content="Kevin Trayner | Principal Experience Designer" />
    <meta property="og:description" content="Strategic design and product leadership portfolio for hiring managers and design leaders." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-left">
        <a class="brand" href="#top" id="brand-name">Portfolio</a>
        <div class="header-note-wrap">
          <button class="header-note" type="button" aria-expanded="false" aria-controls="ai-note-popover">
            Built with Claude + Copilot
          </button>
          <div id="ai-note-popover" class="header-note-popover" role="dialog" aria-live="polite" hidden>
            <p>
              I built this portfolio initially using Claude Code, and then Copilot, publishing to GitHub.
              Locally, I am using VS Code on my laptop to edit and manage this portfolio (and some other
              projects). Like a welcome back/return to my days of UI front end coding a decade ago!
            </p>
          </div>
        </div>
      </div>
      <nav class="main-nav" aria-label="Main navigation" id="main-nav"></nav>
      <div class="variant-picker-wrap" id="variant-picker-wrap" aria-label="Portfolio variant selector"></div>
      <a class="btn btn-ghost" href="#" id="resume-link" target="_blank" rel="noreferrer">Resume</a>
    </header>

    <main id="top">
      <section class="hero reveal" id="hero"></section>
      <section id="work" class="section reveal"></section>
      <section id="working-style" class="section reveal"></section>
      <section id="testimonials" class="section reveal"></section>
    </main>

    <section id="contact" class="contact reveal">
      <p class="section-kicker" id="contact-kicker"></p>
      <h2 id="contact-heading"></h2>
      <div class="contact-links" id="contact-links"></div>
    </section>

    <footer class="site-footer">
      <p id="footer-left"></p>
      <p id="footer-right"></p>
    </footer>

    <script src="content.js"></script>
    <script src="common.js"></script>
    <script src="script.js"></script>
    <script src="edit-mode.js"></script>
  </body>
</html>
